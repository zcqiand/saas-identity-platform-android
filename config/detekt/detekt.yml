build:
  maxIssues: 0
complexity:
  LongMethod:
    active: true
    excludes: ['**/MainActivity.kt', '**/MenusScreens.kt'] # Compose 路由根+多屏单文件（swift 同位视图 300+ 行）；已尽拆（picker/create/tree/dialog/控制器束均独立 composable，130→74），再拆只把 LongMethod 换成 LongParameterList —— 定向豁免 2026-10-19 菜单切片；MenusScreens 屏根 60 行全为段组装（section/tree/dialogs host 已各自成体，实证 6 参即触 LongParameterList），MainActivity 同例定向豁免 2026-10-20 客户端管理切片
  TooManyFunctions:
    active: true
    excludes: ['**/HarnessTraceListener.kt', '**/src/test/**/*.kt', '**/app/MenuWire.kt', '**/MainActivity.kt', '**/app/MembersWire.kt', '**/ui/MembersViewModel.kt', '**/app/RolesWire.kt', '**/ui/RolesViewModel.kt', '**/RolesScreens.kt', '**/ApplicationsScreens.kt'] # porter 类职责单一豁免同前；测试类多 @Test 方法即形态本身（逐测一行为一断言），测试类豁免 2026-10-19 会话持久化切片；MenuWire 每缝一对(外层护栏+私有调用)即形态 2026-10-19 菜单切片；MainActivity 路由根多屏组合 11 函数即形态 2026-10-19 菜单切片；MembersWire 九缝 14 体（每缝一对即形态）2026-10-20 成员切片；MembersViewModel 类内 11 法（九缝生命周期一缝一法 + replaceRow/failFast/runOp 私有体）即形态 2026-10-20 成员切片；RolesWire 八缝 13 体（每缝一对即形态）2026-10-20 角色切片；RolesViewModel 类内 12 法（八缝生命周期一缝一法 + replaceRow/failFast/runOp 私有体）即形态 2026-10-20 角色切片；RolesScreens 屏根 11 顶函数（束/banner/filter/list/row/host 分派+4 host 各自成体，再拆即 LongParameterList——MainActivity/MenusScreens 同例）定向豁免 2026-10-20 角色切片；ApplicationsScreens 屏根 11 顶函数（束/header/list/row/host 分派+3 host+toggle/remember 各自成体，再拆即 LongParameterList——RolesScreens 同例）定向豁免 2026-10-20 应用订阅切片
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable'] # Compose 官方惯例：UI 组件函数 PascalCase（AOSP/Compose 指南），定向豁免 2026-10-19 登录切片
style:
  ReturnCount:
    active: true
    excludes: ['**/ui/OAuthViewModel.kt'] # OAuth 三 grant（authorize/exchange/refresh）各为「clientId 守卫静默 false + 前置条件 fail-fast + runOp 收口」三 return 即形态；结构与 swift 同位，强行合并只会把守卫藏进 catch——定向豁免 2026-10-20 OAuth 切片
exceptions:
  excludes: ['**/ui/AuthViewModel.kt', '**/app/LoginWire.kt', '**/app/MenuWire.kt', '**/ui/MenusViewModel.kt', '**/app/AdminClientsWire.kt', '**/ui/AdminClientsViewModel.kt', '**/app/MembersWire.kt', '**/ui/MembersViewModel.kt', '**/app/RolesWire.kt', '**/ui/RolesViewModel.kt', '**/app/ApplicationsWire.kt', '**/ui/TenantApplicationsViewModel.kt', '**/app/OAuthWire.kt', '**/ui/OAuthViewModel.kt'] # seam 边界归一任意传输层异常为 AuthError.Unreachable、VM 捕缝抛出落 Failed 态，泛捕即职责本身（定向豁免 2026-10-19 登录切片；MenuWire/MenusViewModel 2026-10-19 菜单切片；AdminClientsWire/AdminClientsViewModel 2026-10-20 客户端管理切片；MembersWire/MembersViewModel 2026-10-20 成员切片；RolesWire/RolesViewModel 2026-10-20 角色切片；ApplicationsWire/TenantApplicationsViewModel 2026-10-20 应用订阅切片；OAuthWire/OAuthViewModel 2026-10-20 OAuth 切片）
