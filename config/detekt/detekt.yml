build:
  maxIssues: 0
complexity:
  TooManyFunctions:
    active: true
    excludes: ['**/HarnessTraceListener.kt', '**/src/test/**/*.kt'] # porter 类职责单一豁免同前；测试类多 @Test 方法即形态本身（逐测一行为一断言），测试类豁免 2026-10-19 会话持久化切片
naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable'] # Compose 官方惯例：UI 组件函数 PascalCase（AOSP/Compose 指南），定向豁免 2026-10-19 登录切片
exceptions:
  excludes: ['**/ui/AuthViewModel.kt', '**/app/LoginWire.kt'] # seam 边界归一任意传输层异常为 AuthError.Unreachable，泛捕即职责本身（定向豁免 2026-10-19 登录切片）
